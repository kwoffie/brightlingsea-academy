<?xml version="1.0" encoding="UTF-8"?>
<!--
  Brightlingsea Academy / School logo (512 x 512 PNG source).
  Referenced by Schema.org JSON-LD ("logo") on every page:
    assets/images/logo.png
  Same graduation-cap brand mark as the PWA icons, on a transparent
  background so it works on light and dark surfaces.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="logobg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0068C4"/>
      <stop offset="55%" stop-color="#0056A3"/>
      <stop offset="100%" stop-color="#003D7A"/>
    </linearGradient>
    <linearGradient id="logocap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Rounded brand plate -->
  <rect x="8" y="8" width="496" height="496" rx="96" ry="96" fill="url(#logobg)"/>

  <!-- Orange accent glow -->
  <circle cx="110" cy="110" r="150" fill="#FF6B35" opacity="0.18"/>

  <!-- Graduation cap -->
  <g transform="translate(256 226)">
    <path d="M -132 -18 L 0 -74 L 132 -18 L 0 38 Z" fill="url(#logocap)"/>
    <path d="M -62 12 L -62 52 C -62 78 62 78 62 52 L 62 12 L 0 40 Z" fill="#FFD700" opacity="0.92"/>
    <path d="M 118 -22 L 138 62" stroke="#FF6B35" stroke-width="11" stroke-linecap="round" fill="none"/>
    <circle cx="139" cy="74" r="17" fill="#FF6B35"/>
  </g>

  <!-- Word-mark letter -->
  <text x="256" y="414" font-family="Helvetica, Arial, sans-serif" font-size="140"
        font-weight="bold" fill="#FFFFFF" text-anchor="middle"
        letter-spacing="2">B</text>
</svg>