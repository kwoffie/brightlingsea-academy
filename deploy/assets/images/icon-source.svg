<?xml version="1.0" encoding="UTF-8"?>
<!--
  Brightlingsea Academy — PWA icon source
  Rasterised into icon-192.png / icon-512.png / icon-maskable.png
  Brand colours: Blue #0056A3, Orange #FF6B35, Yellow #FFD700
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0068C4"/>
      <stop offset="55%" stop-color="#0056A3"/>
      <stop offset="100%" stop-color="#003D7A"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Background plate -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Orange accent arc (top-left highlight) -->
  <circle cx="96" cy="96" r="150" fill="#FF6B35" opacity="0.18"/>

  <!-- Graduation cap -->
  <g transform="translate(256 214)">
    <!-- Mortarboard diamond -->
    <path d="M -132 -18 L 0 -74 L 132 -18 L 0 38 Z" fill="url(#cap)"/>
    <!-- Cap body -->
    <path d="M -62 12 L -62 52 C -62 78 62 78 62 52 L 62 12 L 0 40 Z" fill="#FFD700" opacity="0.92"/>
    <!-- Tassel cord -->
    <path d="M 118 -22 L 138 62" stroke="#FF6B35" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Tassel bob -->
    <circle cx="139" cy="74" r="17" fill="#FF6B35"/>
  </g>

  <!-- Word-mark letter -->
  <text x="256" y="404" font-family="Helvetica, Arial, sans-serif" font-size="150"
        font-weight="bold" fill="#FFFFFF" text-anchor="middle"
        letter-spacing="2">B</text>
</svg>