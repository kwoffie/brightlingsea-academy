    <!-- Theme guard: apply the saved colour scheme before first paint -->
    <script>
    (function () {
        try {
            var saved = localStorage.getItem('bla_theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var dark = saved ? saved === 'dark' : prefersDark;
            document.body.classList.toggle('dark-mode', dark);
            document.documentElement.classList.toggle('dark-mode', dark);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
    })();
    </script>
    <!-- Page transition guard (progressive enhancement: never hides content) -->
    <script>
    (function(){try{if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){return;}document.body.classList.add('page-enter');}catch(e){}})();
    </script>
